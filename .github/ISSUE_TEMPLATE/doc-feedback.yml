name: 📝 Documentation feedback
description: Report something missing, unclear, or wrong on a documentation page.
title: "docs: "
labels: ["documentation", "feedback"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The documentation page this is about.
      placeholder: https://tlahey.github.io/git-manager/docs/features/commit-graph
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What's missing, unclear, or wrong?
      description: Tell us what you expected to find, or what would have helped.
    validations:
      required: true
