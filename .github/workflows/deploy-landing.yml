name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      # Only deploy when the published site itself (or this workflow) changes.
      # The page also depends on packages/mascot — after a mascot-only change,
      # trigger a manual redeploy from the Actions tab (workflow_dispatch).
      - 'apps/landing-page/**'
      - 'apps/docs/**'
      # The docs are generated from the end-to-end scenarios and the screenshots
      # those scenarios export, so both are sources of the published site.
      - 'apps/e2e/features/**'
      - 'docs/screenshots/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

# Native GitHub Pages deployment (no gh-pages branch): the build is uploaded
# as an ephemeral artifact and published via OIDC. Repo Settings → Pages must
# use source "GitHub Actions" — configure-pages enables it automatically.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let in-flight deployments finish (GitHub's recommendation)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build landing page and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # --strict fails the deploy when a documented scenario has no screenshot
      # committed under docs/screenshots/, rather than silently publishing a
      # page with a hole where the picture should be.
      - name: Generate documentation pages
        run: pnpm --filter @git-manager/docs exec node scripts/generate.ts --strict

      # One VitePress app builds the whole site: the landing page at the root
      # (apps/docs/index.md renders apps/landing-page's own markup, styles and
      # behaviour) and the documentation under /docs/.
      - name: Build the site
        run: pnpm --filter @git-manager/docs exec vitepress build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
