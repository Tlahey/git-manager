packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@wdio/native-utils": "^2.5.0"

catalog:
  typescript: ^7.0.2
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@types/node": ^26.2.0
  vitest: ^4.1.10
  "@vitest/browser": ^4.1.10
  "@vitest/browser-playwright": ^4.1.10
  "@testing-library/jest-dom": ^7.0.0
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.3
  jsdom: ^30.0.1
  vite: ^8.2.0
  lucide-react: ^1.34.0
  "@vitejs/plugin-react": ^6.0.5
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  postcss: ^8.5.25
  storybook: ^10.5.6
  "@storybook/react": ^10.5.6
  "@storybook/react-vite": ^10.5.6
  # Pinned exact: Storybook requires every @storybook/* package on the identical
  # version. A caret let addon-a11y float to 10.5.2 while core stayed 10.4.6, which
  # crashed the preview (react interop) and desynced the UniversalStore.
  "@storybook/addon-a11y": 10.5.6
  "@storybook/addon-vitest": 10.5.6
  "@monaco-editor/react": ^4.7.0
  monaco-editor: ^0.56.0
  axe-core: ^4.12.1
  "tw-animate-css": ^1.4.0

allowBuilds:
  '@swc/core': true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  unrs-resolver: true
