[package]
name = "git-manager"
version = "0.3.0"
description = "Git Manager Desktop"
authors = ["git-manager"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "git_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "tray-icon", "protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.19", features = ["ssh", "https"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
glob = "0.3"
# Real PTY for the integrated terminal (spawns the user's login shell so ~/.zshrc is sourced).
portable-pty = "0.8"
# The OS keychain, and the only place a provider token or an AI key is stored — see
# services/credential_store.rs. `default-features = false` drops the Linux Secret Service and
# Windows backends this macOS-only app cannot use; `apple-native` is the Keychain itself. Deliberately
# NOT the `keyring` Tauri plugin: a plugin would expose a *read* to JavaScript, which is the one thing
# this whole arrangement exists to prevent.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# WebdriverIO E2E testing support (behind the "e2e" feature, see docs/architecture — this
# embeds a WebDriver server in the binary, so it must never be compiled into a real build).
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# NSVisualEffectView behind the webview, so a translucent theme's chrome shows the
# blurred desktop rather than a blurred copy of the app's own background. CSS
# backdrop-filter can only sample what is inside the webview, so this is the only
# way to get the real macOS sidebar material. Enabled at runtime only by the theme
# that asks for it (see set_window_vibrancy in commands/window.rs).
[target."cfg(target_os = \"macos\")".dependencies]
# Turns the notch card into a nonactivating NSPanel, so clicking it does not drag the whole app in
# front of the user — see `make_notch_window_nonactivating` in commands/window.rs. On by default,
# with GIT_MANAGER_NOTCH_PANEL=0 as the escape hatch, because an earlier form of the same mechanism
# aborted the process and a user who meets a crash must be able to get a working app back without
# waiting for a release.
#
# A git dependency because there is no crates.io release: the name `tauri-nspanel` is unpublished,
# and this is the plugin every "click me without activating the app" Tauri project uses. Pinned to a
# revision rather than the branch, so what builds today is what builds in six months. It brings the
# *old* `objc` 0.2 stack (cocoa, objc_id, objc-foundation) alongside the `objc2` 0.5 this crate
# already uses; both compile, and one transitive crate (`block` 0.1.6) already warns as
# future-incompatible. Worth revisiting if a maintained objc2-based equivalent appears.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
window-vibrancy = "0.5"
# Clickable notifications. tauri-plugin-notification can only *show* one on desktop (its
# `onAction` listener is mobile-only), and this is the crate its own macOS backend already
# uses underneath — so it is already compiled, and it does expose the click.
# See services/native_notification.rs.
mac-notification-sys = "0.6"
# Read-only introspection of the native window (opacity, background, view stack) so a
# translucent theme that renders opaque can be diagnosed from the log instead of guessed
# at. Same versions window-vibrancy already pulls in, so this adds no new compilation.
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
  "NSView",
  "NSColor",
  "NSGraphics",
  "NSVisualEffectView",
  # NSWindow.setAppearance: — the PER-WINDOW appearance pin. Tauri's own `set_theme` is
  # app-wide on macOS (see pin_window_appearance in commands/window.rs), which is why this
  # has to go through AppKit directly.
  "NSAppearance",
  # NSScreen.safeAreaInsets / auxiliaryTopLeft(Right)Area — the real per-machine notch/camera
  # housing geometry, read once at startup instead of guessed at with a hard-coded 32pt/100pt.
  # See get_notch_metrics in commands/window.rs.
  "NSScreen",
  # NSApplication.isActive — the veto on creating a webview while the app is in the background,
  # which wry would turn into an activation and so into a stolen keyboard. See is_app_active in
  # commands/window.rs.
  "NSApplication",
] }
# NSRect/NSEdgeInsets, the return types of the NSScreen geometry methods above. Same version
# NSScreen's own "NSScreen" feature already pulls in transitively; declared directly because the
# types are named in commands/window.rs, not just used through it.
objc2-foundation = { version = "0.2.2", default-features = false, features = [
  "std",
  "NSGeometry",
  # `MainThreadMarker::new()` — satisfied today by another dependency's own feature request
  # (Cargo unifies features across the build), but declared directly so this code's own
  # requirement doesn't depend on staying true of some other crate.
  "NSThread",
] }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
# Only enabled by release.yml's universal-apple-darwin build: pkg-config can't cross-compile
# system OpenSSL from an aarch64 runner to x86_64, so that build vendors (compiles from source)
# OpenSSL for each target instead. Left off by default so local dev builds keep using the fast,
# already-installed system OpenSSL.
vendored-openssl = ["git2/vendored-openssl"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
