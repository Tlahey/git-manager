[package]
name = "git-manager"
version = "0.2.0"
description = "Git Manager Desktop"
authors = ["git-manager"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "git_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "tray-icon", "protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.19", features = ["ssh", "https"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
glob = "0.3"
# Real PTY for the integrated terminal (spawns the user's login shell so ~/.zshrc is sourced).
portable-pty = "0.8"

# WebdriverIO E2E testing support (behind the "e2e" feature, see docs/architecture — this
# embeds a WebDriver server in the binary, so it must never be compiled into a real build).
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# NSVisualEffectView behind the webview, so a translucent theme's chrome shows the
# blurred desktop rather than a blurred copy of the app's own background. CSS
# backdrop-filter can only sample what is inside the webview, so this is the only
# way to get the real macOS sidebar material. Enabled at runtime only by the theme
# that asks for it (see set_window_vibrancy in commands/window.rs).
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"
# Clickable notifications. tauri-plugin-notification can only *show* one on desktop (its
# `onAction` listener is mobile-only), and this is the crate its own macOS backend already
# uses underneath — so it is already compiled, and it does expose the click.
# See services/native_notification.rs.
mac-notification-sys = "0.6"
# Read-only introspection of the native window (opacity, background, view stack) so a
# translucent theme that renders opaque can be diagnosed from the log instead of guessed
# at. Same versions window-vibrancy already pulls in, so this adds no new compilation.
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
  "NSView",
  "NSColor",
  "NSGraphics",
  "NSVisualEffectView",
  # NSScreen.safeAreaInsets / auxiliaryTopLeft(Right)Area — the real per-machine notch/camera
  # housing geometry, read once at startup instead of guessed at with a hard-coded 32pt/100pt.
  # See get_notch_metrics in commands/window.rs.
  "NSScreen",
] }
# NSRect/NSEdgeInsets, the return types of the NSScreen geometry methods above. Same version
# NSScreen's own "NSScreen" feature already pulls in transitively; declared directly because the
# types are named in commands/window.rs, not just used through it.
objc2-foundation = { version = "0.2.2", default-features = false, features = [
  "std",
  "NSGeometry",
  # `MainThreadMarker::new()` — satisfied today by another dependency's own feature request
  # (Cargo unifies features across the build), but declared directly so this code's own
  # requirement doesn't depend on staying true of some other crate.
  "NSThread",
] }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
